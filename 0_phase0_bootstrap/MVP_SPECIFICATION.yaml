# MVP Specification - MCP Google Marketing Ops Tool
# This file defines the complete project specification for the MCP server
# All fields match the full schema in 7_schemas/mvp_specification.schema.json
# CRITICAL: This specification preserves 100% fidelity from MVP_MCP_Analytics_Tool.md

# Required Core Fields
Project: "mcp-google-marketing"
Maturity: "L2.5"  # L2 | L2.5 | L3
Architecture: "mcp-server"  # MCP server architecture
Repo_Type: "backend"  # frontend | backend | fullstack | microservice | monorepo
Execution_Mode: "Controlled Agentic Execution"  # Human Directed | Controlled Agentic Execution | Fully Agentic

# Goals and Principles
GOALS_AND_PRINCIPLES:
  goals:
    - "Build a reusable, project-agnostic MCP server that exposes safe, idempotent, full-fidelity tools for Google Ads, Google Tag Manager, and Google Analytics 4 from inside Cursor IDE"
    - "Support read/write/create/delete operations with stateful verification, strong observability, TDD-first delivery, and security best practices"
    - "Expose at least 75+ atomic tools covering full API capabilities: GA4 (35+), GTM (20+), Google Ads (15+)"
    - "Enable auth once, then seamless access from any repo in Cursor"
    - "Ensure all write ops are idempotent, logged, pre/post-validated, and rollbackable"
    - "Route discovery/verification ensures no out-of-scope or deprecated endpoints are exposed"
    - "Full support for custom event tracking, data layer management, and conversion setup across all products"
    - "Ship with test matrix (unit + integration + contract), CI gates, and developer docs"
  principles:
    - "Test-driven development (TDD-first delivery)"
    - "Idempotency for all write operations"
    - "Stateful verification with pre/post validation"
    - "Strong observability with structured logging"
    - "Security best practices (OAuth, encryption, minimal scopes)"
    - "Code quality through automation"
    - "Documentation as code with AI-first notes"

# Technology Stack
TECH_STACK:
  frontend:
    framework: "none"  # MCP server, no frontend
    language: ""
    styling: []
    animations: ""
    validation: ""
  backend:
    framework: "mcp"  # Model Context Protocol server
    language: "typescript"
    orm: ""
    runtime: "nodejs"
    protocol: "@modelcontextprotocol/server"
  shared:
    language: "typescript"
  integrations:
    - "google-auth-library"
    - "googleapis"
    - "google-ads-api"
    - "zod"
    - "pino"
    - "libsodium"
  optional_libs:
    - "vitest"
    - "nock"
    - "sqlite3"

# Monorepo Layout (Nested Object Structure)
MONOREPO_LAYOUT:
  root:
    src:
      server: {}
      core: {}
      auth: {}
      ga4: {}
      gtm: {}
      ads: {}
      docs: {}
    test: {}
    scripts: {}
    docs: {}
  apps: {}
  scripts:
    - "scripts/smoke.mjs"
    - "scripts/dev.sh"
  shared:
    types: {}
    utils: {}

# Environment and Configuration
ENVIRONMENT_AND_CONFIG:
  env_notes:
    - "GOOGLE_CLIENT_ID - OAuth client ID for Google APIs"
    - "GOOGLE_CLIENT_SECRET - OAuth client secret"
    - "GOOGLE_ADS_DEV_TOKEN - Google Ads API developer token"
    - "LOGIN_CUSTOMER_ID - Google Ads login customer ID"
    - "GA4_MEASUREMENT_PROTOCOL_SECRET - GA4 Measurement Protocol secret"
    - "MCP_MARKETING_DRY_RUN - Enable dry-run mode (1 = enabled)"
  config_file: "~/.mcp/google/config.json"
  credentials_file: "~/.mcp/google/credentials.enc.json"
  capabilities_file: "~/.mcp/google/capabilities.json"

# Routing Model
ROUTING_MODEL:
  type: "mcp-tools"  # MCP tool-based routing
  base_path: ""
  data_source: ""

# Schema Definition
SCHEMA_DEFINITION:
  validation_lib: "zod"
  schema_files:
    - "src/ga4/schemas.ts"
    - "src/gtm/schemas.ts"
    - "src/ads/schemas.ts"
    - "src/core/validation.ts"
  modules:
    - "src/core/validation.ts"

# Brand Module
BRAND_MODULE:
  colors: {}
  fonts: {}
  cta_text: ""
  disclaimers: []

# Analytics and Events
ANALYTICS_AND_EVENTS:
  provider: "google-analytics"
  events: []
  pixels: []

# Integrations
INTEGRATIONS:
  google_analytics_4:
    description: "GA4 Data API, Admin API, Measurement Protocol"
    scopes:
      - "https://www.googleapis.com/auth/analytics.readonly"
      - "https://www.googleapis.com/auth/analytics.edit"
      - "https://www.googleapis.com/auth/analytics.manage.users"
  google_tag_manager:
    description: "GTM API v2"
    scopes:
      - "https://www.googleapis.com/auth/tagmanager.readonly"
      - "https://www.googleapis.com/auth/tagmanager.edit.containers"
      - "https://www.googleapis.com/auth/tagmanager.publish"
      - "https://www.googleapis.com/auth/tagmanager.manage.accounts"
  google_ads:
    description: "Google Ads API (gRPC/REST)"
    requires_developer_token: true
  optional_future: []

# SEO and JSON-LD
SEO_AND_JSONLD:
  meta_fields: []
  jsonld: []
  sitemap: {}

# AI UI Generation
AI_UI_GENERATION:
  tool: ""
  prompt_library: ""
  pattern: ""

# Automation Scripts
AUTOMATION_SCRIPTS:
  smoke: "scripts/smoke.mjs"
  dev: "pnpm dev"
  test: "pnpm test"
  build: "pnpm build"

# Interactive Patterns
INTERACTIVE_PATTERNS: {}

# QA Checklist
QA_CHECKLIST:
  - "All 75+ tools implemented and tested"
  - "Idempotency verified for all write operations"
  - "Pre/post validation working correctly"
  - "Rollback mechanisms tested"
  - "Rate limiting and retry logic verified"
  - "Security: OAuth flow, token encryption, scope validation"
  - "Capability discovery and route verification working"
  - "Data layer validation and schema enforcement"
  - "Cross-product workflows tested (GTM → GA4 → Ads)"
  - "Test matrix complete (unit + integration + contract)"
  - "Documentation complete with examples"

# Deployment
DEPLOYMENT:
  provider: "docker"  # Docker containerization for local and future cloud deployment
  local: "docker-compose"  # Local development via docker-compose
  containerization: true  # Docker support enabled
  domain: ""
  dns: ""
  preview: false
  docker:
    base_image: "node:20-alpine"
    multi_stage: true
    health_check: true
    volumes:
      - "~/.mcp/google:/app/.mcp/google"  # Config and credentials
    ports:
      - "3000:3000"  # MCP server port (if needed)
    environment:
      - "NODE_ENV=production"
      - "All env vars from .env"

# Migration Path
MIGRATION_PATH:
  future_subdomains: ""
  automation: ""

# First Run Playbook
FIRST_RUN_PLAYBOOK:
  steps:
    - "Option 1 (Docker): docker-compose up → use auth.login tool → confirm auth.status"
    - "Option 2 (Local): pnpm install → pnpm dev → run auth.login → confirm auth.status"
    - "Set environment variables: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_ADS_DEV_TOKEN, LOGIN_CUSTOMER_ID"
    - "Run: capabilities.refresh → inspect ~/.mcp/google/capabilities.json"
    - "Run smoke tests: GA4 report, GTM list, Ads GAQL"
    - "Enable dry-run mode; try gtm.tag.upsert with postcheck"
    - "Write first integration tests → iterate"

# Post-MVP Features
POST_MVP_FEATURES:
  - "Terraformable secrets & config; cloud runner"
  - "Scheduled jobs (e.g., nightly reports) via MCP cron companion"
  - "Cross-product audits (GTM <-> repo code <-> GA4 <-> Ads) with fix-it PRs"
  - "Opinionated playbooks: budget pacing, n-gram negative keyword miner, LTV-aware bidding suggestions"
  - "UI companion in VSCode/Cursor sidebar (webview) for charts & diffs"
  - "Multi-user RBAC; team secrets sync; cloud deployment"
  - "Billing management, Smart Campaigns special cases, auto-generated ad assets"

# Day 1 Deliverables
DELIVERABLES_DAY1:
  outputs:
    - "Project structure initialized (mcp-google-marketing/)"
    - "Core modules scaffolded (core/, auth/, ga4/, gtm/, ads/)"
    - "Package.json with dependencies"
    - "TypeScript configuration"
    - "Pre-commit hooks installed"
    - "CI/CD workflows configured"
    - "Development environment ready"
    - "Basic MCP server bootstrap"
  success_metric: "All initialization steps complete without errors, MCP server can start and register tools"

# Active Plan Template
ACTIVE_PLAN_TEMPLATE:
  plan_id: "mcp-google-marketing-mvp"
  component: "backend"
  goal: "Build MCP server with 75+ tools for GA4, GTM, and Google Ads"
  tasks:
    - id: 1
      name: "Set up project structure and core modules"
      outputs: ["src/server.ts", "src/core/", "package.json", "tsconfig.json"]
    - id: 2
      name: "Implement authentication (OAuth, token management, encryption)"
      outputs: ["src/auth/oauth.ts", "src/auth/secrets.ts"]
    - id: 3
      name: "Build core infrastructure (logger, limiter, cache, envelope, validation, error model)"
      outputs: ["src/core/logger.ts", "src/core/limiter.ts", "src/core/cache.ts", "src/core/opEnvelope.ts", "src/core/validation.ts", "src/core/errors.ts"]
    - id: 4
      name: "Implement capability discovery and route verification"
      outputs: ["src/core/capabilities.ts"]
    - id: 5
      name: "Implement GA4 Data API tools (report.run, report.batch, report.pivot, realtime.snapshot)"
      outputs: ["src/ga4/client.ts", "src/ga4/tools.ts", "src/ga4/schemas.ts"]
    - id: 6
      name: "Implement GA4 Admin API tools (properties, data streams, custom dimensions/metrics, events, conversions, audiences, attribution)"
      outputs: ["src/ga4/tools.ts (extended)"]
    - id: 7
      name: "Implement GA4 Measurement Protocol tools"
      outputs: ["src/ga4/tools.ts (extended)"]
    - id: 8
      name: "Implement GTM tools (containers, workspaces, tags, triggers, variables, versions, folders)"
      outputs: ["src/gtm/client.ts", "src/gtm/tools.ts", "src/gtm/schemas.ts"]
    - id: 9
      name: "Implement GTM data layer validation and schema management"
      outputs: ["src/gtm/tools.ts (extended)"]
    - id: 10
      name: "Implement Google Ads tools (reporting, campaigns, ad groups, ads, keywords, conversions, audiences, budgets)"
      outputs: ["src/ads/client.ts", "src/ads/tools.ts", "src/ads/schemas.ts"]
    - id: 11
      name: "Implement cross-product workflows (GTM → GA4 → Ads)"
      outputs: ["src/core/workflows.ts"]
    - id: 12
      name: "Write comprehensive test suite (unit + integration + contract)"
      outputs: ["test/unit/", "test/integration/", "test/contract/"]
    - id: 13
      name: "Create developer documentation"
      outputs: ["README.md", "docs/tools.md", "docs/auth.md", "docs/errors.md", "docs/observability.md", "docs/contrib.md", "docs/datalayer.md", "docs/custom-events.md", "docs/conversions.md"]
  status: "active"
  auto_commit: true
  commit_frequency: checkpoint_based
  commit_checkpoints:
    after_phases: true
    after_task_count: 5
    after_file_threshold: 10
    force_commit_on_checkpoint: true

# Feature Flags Reference
FEATURE_FLAGS_REFERENCE:
  cursor_agent_mode: "sandboxed"
  agentic_write_ops: true
  modify_meta_framework: false
  dry_run_mode: true
  enable_rollback: true
  enable_capability_discovery: true

# Summary for Initializer
SUMMARY_FOR_INITIALIZER:
  intent:
    - "Initialize MCP server project structure from specification"
    - "Validate all configuration files"
    - "Scaffold directory structure (src/core/, src/auth/, src/ga4/, src/gtm/, src/ads/)"
    - "Set up development environment (TypeScript, dependencies)"
    - "Generate active plan from template"
    - "Install pre-commit hooks"
    - "Enable AI-assisted development workflow"
    - "Configure CI/CD workflows"

# DETAILED SPECIFICATION
# This section preserves 100% of the original MVP_MCP_Analytics_Tool.md content
# All details, examples, workflows, and technical specifications are included below

DETAILED_SPECIFICATION:
  goal_and_success_criteria:
    goal: "A reusable, project-agnostic MCP server that exposes safe, idempotent, full-fidelity tools for Google Ads, Google Tag Manager, and Google Analytics 4 from inside Cursor IDE. It must support read/write/create/delete, with stateful verification, strong observability, TDD-first delivery, and security best practices."
    success_criteria:
      - "One MCP server exposing at least 75+ atomic tools covering full API capabilities:"
      - ga4: "35+ tools (Data API, Admin API, Measurement Protocol, Data Filters, Integrations, Explorations)"
      - gtm: "20+ tools (containers, workspaces, tags, triggers, variables, data layer, versions)"
      - google_ads: "15+ tools (reporting, campaigns, conversions, audiences, budgets)"
      - "Auth once, then seamless access from any repo in Cursor"
      - "All write ops are idempotent, logged, pre/post-validated, and rollbackable"
      - "Route discovery/verification ensures no out-of-scope or deprecated endpoints are exposed"
      - "Full support for custom event tracking, data layer management, and conversion setup across all products"
      - "Ship with test matrix (unit + integration + contract), CI gates, and developer docs"

  scope:
    description: "This MVP provides COMPLETE API coverage for all three products, enabling full customization of services, conversions, custom event tracking, and data layer management."
    api_verification_status:
      verified: "94% - Core endpoints confirmed in official Google APIs"
      needs_testing: "6% - Advanced features require API testing"
      not_supported: "<1% - Features requiring workarounds or UI-only configuration"
    verification_reference: "See docs/API_VERIFICATION_REAL_WORLD.md for detailed verification status of all endpoints."
    included:
      ga4:
        description: "Analytics Data API + Admin API"
        data_api: "run reports, realtime snapshots, batch reports, pivot reports"
        admin_api: "manage properties, data streams, custom dimensions/metrics, conversion events, audiences, attribution settings, data retention, enhanced measurement"
        measurement_protocol: "server-side event tracking with validation"
        event_definitions: "create/update/delete custom events, modify event parameters"
      gtm:
        description: "Tag Manager API v2"
        containers: "list/create/update/delete, settings, environments"
        workspaces: "list/create/update/delete, merge, resolve conflicts"
        tags: "full CRUD, firing rules, tag sequencing, tag priority"
        triggers: "custom triggers, event triggers, page view triggers, click triggers, form triggers, timer triggers, visibility triggers, scroll depth triggers"
        variables: "custom variables, data layer variables, built-in variables, constant variables, lookup tables, regex tables, JavaScript variables, URL variables, container settings"
        data_layer: "schema validation, data layer monitoring, variable references"
        versions: "create/list/restore, publish, preview/debug mode"
        folders: "organize tags/triggers/variables"
        consent_mode: "configure consent settings"
      google_ads:
        description: "Google Ads API"
        gaql_reporting: "full query language support, batch reports, streaming reports"
        campaigns: "create/update/delete, budgets, bidding strategies, ad schedules, targeting"
        ad_groups: "create/update/delete, targeting, ad group types"
        ads: "responsive search ads, display ads, video ads, app ads"
        keywords: "create/update/delete, match types, bid adjustments, negative keywords"
        conversion_actions: "create/update/delete, conversion tracking setup, offline conversions, enhanced conversions, value rules"
        audiences: "customer match, remarketing lists, custom audiences, audience insights"
        extensions: "sitelinks, callouts, structured snippets, call extensions, location extensions"
      cross_cutting:
        - "Read/Write/Delete parity for all objects in each product"
        - "Capability registry + route verification at server startup and on demand"
        - "Caching, rate limiting, retries with jitter, structured logging, dry-run mode, and transaction envelopes"
        - "Data layer validation and schema enforcement for GTM"
        - "Cross-product workflows: GTM → GA4 event forwarding, GA4 → Ads conversion linking, Ads → GA4 audience sync"
    out_of_scope:
      - "Billing management, Smart Campaigns special cases, auto-generated ad assets"
      - "Multi-user RBAC; team secrets sync; cloud deployment"
      - "Real-time collaboration features (GTM workspace locking handled via API)"
      - "UI/visual editors (all operations via API/MCP tools)"

  api_endpoints:
    ga4_analytics_data_api_v1:
      - "properties/{property}/runReport ✅"
      - "properties/{property}/runRealtimeReport ✅"
      - "properties/{property}/runPivotReport ✅"
      - "properties/{property}/batchRunReports ✅"
      - "properties/{property}/batchRunPivotReports ✅"
      - "properties/{property}/checkCompatibility ✅"
    ga4_admin_api_v1beta:
      properties: "list, get, create, update, delete ✅ Verified"
      property_settings: "get, update (currency, timezone, display name) ⚠️ Partial (via properties.update)"
      google_signals: "get, update ⚠️ Needs Testing (may be in property settings)"
      data_retention_settings: "get, update ✅ Verified"
      consent_mode: "get, update ⚠️ Needs Testing (may be UI-only or in property settings)"
      data_streams: "list, get, create, update, delete, getDataRedactionSettings, updateDataRedactionSettings ✅ Verified"
      enhanced_measurement_settings: "get, update (granular event control) ⚠️ Needs Testing (may be in dataStream resource)"
      data_filters: "list, get, create, update, delete (internal traffic, bot filtering) ❌ Not Found (likely UI-only, see workarounds)"
      custom_dimensions: "list, get, create, patch, archive (USER, EVENT, ITEM scopes) ✅ Verified (uses archive not delete)"
      custom_metrics: "list, get, create, patch, archive (currency, time units) ✅ Verified (uses archive not delete)"
      event_create_rules: "list, get, create, update, delete ✅ Verified"
      event_parameters: "list, get, create, update, delete ❌ Not Supported (parameters are dynamic, use custom dimensions)"
      conversion_events: "list, get, create, delete ✅ Verified"
      audiences: "list, get, create, patch, archive ✅ Verified (uses archive not delete)"
      audience_triggers: "get, update (automatic refresh) ⚠️ Needs Testing (may be in audience resource)"
      smart_audiences: "create (ML-powered) ⚠️ Needs Testing (may use standard audience.create)"
      attribution_settings: "get, update ✅ Verified"
      google_ads_links: "list, get, create, update, delete ⚠️ Needs Testing (may be UI-only, check Google Ads API)"
      google_ads_conversion_import: "list, get, create, update, delete ⚠️ Needs Testing (may be UI-only)"
      bigquery_links: "list, get, create, delete ✅ Verified"
      legend: "✅ Verified | ⚠️ Needs Testing | ❌ Not Supported"
    ga4_measurement_protocol:
      - "mp/collect (send events) ✅"
      - "mp/debug/mp/collect (validate events) ✅"
    gtm_api_v2:
      accounts: "list, get ✅"
      containers: "list, get, create, update, delete ✅"
      workspaces: "list, get, create, update, delete, sync, resolve_conflict, quick_preview, status ✅"
      tags: "list, get, create, update, delete, revert ✅"
      triggers: "list, get, create, update, delete, revert ✅"
      variables: "list, get, create, update, delete, revert ✅"
      builtin_variables: "list, create, delete, revert ✅"
      folders: "list, get, create, update, delete, revert, entities ✅"
      versions: "list, get, create, delete, publish, restore ✅"
      environments: "list, get, create, update, delete, reauthorize ✅"
      zones: "list, get, create, update, delete, revert ✅"
    google_ads_api:
      customer_service: "getCustomer, listAccessibleCustomers, mutateCustomer ✅"
      campaign_service: "get, mutate, mutateLabels ✅"
      ad_group_service: "get, mutate ✅"
      ad_group_ad_service: "get, mutate ✅"
      ad_group_criterion_service: "get, mutate (keywords, placements, etc.) ✅"
      campaign_budget_service: "get, mutate ✅"
      conversion_action_service: "get, mutate, mutateValue, uploadClickConversions, uploadCallConversions, uploadConversionAdjustments ✅"
      customer_match_service: "uploadUserData ✅"
      audience_service: "get, mutate ✅"
      campaign_audience_view_service: "get ✅"
      google_ads_service: "search, searchStream (GAQL queries) ✅"
      batch_job_service: "mutateBatchJobs, listBatchJobResults ✅"
      extension_feed_item_service: "get, mutate ✅"
      campaign_extension_setting_service: "get, mutate ✅"

  architecture:
    runtime: "Node.js (TypeScript) MCP server (@modelcontextprotocol/server)"
    modules:
      ga4: "Data API, Admin API, Measurement Protocol"
      gtm: "Containers, Workspaces, Tags, Triggers, Variables, Data Layer, Versions"
      ads: "Reporting, Campaigns, Conversions, Audiences, Budgets"
      auth: "OAuth, token management, encryption"
      core: "Logging, cache, http, grpc, validation, capabilities, data layer schema"
      docs: "Documentation and examples"
    transport:
      ga4_gtm: "REST over HTTPS with google-auth-library"
      google_ads: "gRPC using official client; fall back to REST for token introspection where useful"
      measurement_protocol: "REST API with validation endpoint"
    patterns:
      command: "Each tool = small atomic command. Tools call service adapters (pure functions) wrapped in Operation Envelope with pre/post validation and logging"
      idempotency: "Operation keys + deterministic request bodies + server-side state checks"
      data_layer_management: "Schema validation, variable extraction, event monitoring, cross-product synchronization"
    config: "Per-user config file + environment variables"
    directory_layout: |
      mcp-google-marketing/
        ├─ src/
        │  ├─ server.ts                # MCP bootstrap & tool registration
        │  ├─ core/
        │  │  ├─ opEnvelope.ts         # operation wrapper (pre/post/rollback)
        │  │  ├─ logger.ts             # pino-style JSON logger
        │  │  ├─ cache.ts              # LRU/TTL + ETag aware
        │  │  ├─ limiter.ts            # token bucket + adaptive backoff
        │  │  ├─ errors.ts             # typed errors & retry policy
        │  │  ├─ validation.ts         # zod schemas for args & responses
        │  │  └─ capabilities.ts       # route discovery/verification registry
        │  ├─ auth/
        │  │  ├─ oauth.ts              # OAuth device or local loop; token store
        │  │  └─ secrets.ts             # encryption-at-rest (OS keychain fallback)
        │  ├─ ga4/
        │  │  ├─ client.ts             # REST client wrapper
        │  │  ├─ tools.ts              # MCP tools (query, conversion mgmt, health)
        │  │  └─ schemas.ts            # zod schemas for GA4 args/results
        │  ├─ gtm/
        │  │  ├─ client.ts
        │  │  ├─ tools.ts              # list/create/update/publish/version
        │  │  └─ schemas.ts
        │  ├─ ads/
        │  │  ├─ client.ts             # gRPC client + GAQL helpers
        │  │  ├─ tools.ts              # report, create/update, conversions
        │  │  └─ schemas.ts
        │  └─ docs/
        │     └─ examples/             # example MCP prompts & flows
        ├─ test/                       # vitest + pact-like contracts
        ├─ scripts/                    # local dev helpers
        ├─ .github/workflows/ci.yml
        ├─ package.json
        └─ README.md

  security:
    auth: "OAuth 2.0 with offline access; store refresh tokens encrypted (libsodium) in ~/.mcp/google/credentials.enc.json. Client IDs/Secrets via env vars; never commit secrets"
    scopes: "Minimal required per tool; escalate only on demand"
    token_hygiene: "automatic refresh; revoke support; rotate via auth.rotate tool"
    data_at_rest: "Encrypt token store; redact PII in logs; structured logs include hashes not raw values"
    network: "HTTPS only; certificate pinning optional; retry on 5xx only"
    dry_run_mode: "MCP_MARKETING_DRY_RUN=1 forces read-only or no-op writes with full pre/post validation simulation"

  operation_envelope:
    description: "All tools execute inside a shared envelope that guarantees consistency"
    json_structure: |
      {
        "op_id": "uuid-v7",
        "op_name": "gtm.create_tag",
        "idempotency_key": "hash(payload + target)",
        "timestamp": "ISO8601",
        "actor": "local-user",
        "target": {"product": "gtm", "accountId": "...", "containerId": "..."},
        "request": {"args": {"...": "..."}},
        "precheck": {"capability": true, "exists": false, "conflicts": []},
        "attempt": {"n": 1, "retry_policy": "exp-jitter", "rate_limit_state": {"tokens": 47}},
        "result": {"status": "success", "resource_id": "...", "etag": "..."},
        "postcheck": {"read_back": true, "state_match": true},
        "rollback": {"needed": false, "action": null},
        "latency_ms": 312,
        "warnings": [],
        "notes": ""
      }
    idempotency_rules:
      - "Compute idempotency_key from normalized request + target resource identifiers"
      - "Before write: prefetch current state; if identical → short-circuit success"
      - "After write: read-back verify authoritative state. If mismatch → conditional rollback"

  capability_discovery:
    description: "At startup, call discovery routines per product to build a Capability Registry (cached on disk)"
    discovery_actions:
      - "API versions available; feature flags; accessible accounts/properties/containers"
      - "For Ads, run a low-cost GAQL probe (e.g., SELECT customer.id FROM customer LIMIT 1)"
      - "For GTM, list accounts/containers; confirm publish perm via dry-run"
      - "For GA4, test a trivial report and admin read"
    runtime_behavior: "Tools check the registry at runtime; if capability is absent, they hard-fail with a typed error and remediation hints"
