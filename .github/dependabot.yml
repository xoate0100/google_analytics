# fleet-normalization-v1 task 7 — grouped patch/minor only; majors ignored
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        versions: [">=16.0.0"]
    groups:
      npm_root_patch_minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        versions: [">=16.0.0"]
    groups:
      pip_root_patch_minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        versions: [">=16.0.0"]
    groups:
      github_actions_root_patch_minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

